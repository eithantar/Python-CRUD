<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Students{% endblock %} · Student Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('list_students') }}">
        <span class="brand-mark">S</span>
        <span class="brand-text">Student Registration</span>
      </a>
      <nav class="topnav">
        <a href="{{ url_for('list_students') }}" class="{{ 'active' if request.endpoint == 'list_students' }}">Students</a>
        <a href="{{ url_for('create_student') }}" class="btn btn-primary btn-sm">+ Add student</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="toasts" aria-live="polite">
          {% for category, message in messages %}
            <div class="toast toast-{{ category }}" role="status">
              <span>{{ message }}</span>
              <button type="button" class="toast-close" aria-label="Dismiss">&times;</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
